<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Flappy Rails</title>
  <desc id="desc">A small yellow bird flies along a dotted path through green pipes above a railway track. Its signal bars show the last bar missing.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fb6c4"/>
      <stop offset="1" stop-color="#b6ecf2"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fd14f"/>
      <stop offset="0.35" stop-color="#b6ec6e"/>
      <stop offset="1" stop-color="#5aa31f"/>
    </linearGradient>
    <g id="cloud" fill="#fff" opacity="0.92">
      <circle cx="0" cy="0" r="26"/>
      <circle cx="34" cy="-10" r="32"/>
      <circle cx="72" cy="2" r="24"/>
      <rect x="-26" y="0" width="124" height="26" rx="13"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <use href="#cloud" x="330" y="64"/>
  <use href="#cloud" x="820" y="50"/>

  <!-- pipes: top body, top cap, bottom cap, bottom body -->
  <g stroke="#3d5a1c" stroke-width="4" stroke-linejoin="round">
    <!-- pair 1 (gap 90 to 210) -->
    <rect x="15" y="-10" width="90" height="80" fill="url(#pipe)"/>
    <rect x="5" y="60" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="5" y="210" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="15" y="240" width="90" height="100" fill="url(#pipe)"/>
    <!-- pair 2 (gap 150 to 270) -->
    <rect x="145" y="-10" width="90" height="140" fill="url(#pipe)"/>
    <rect x="135" y="120" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="135" y="270" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="145" y="300" width="90" height="40" fill="url(#pipe)"/>
    <!-- pair 3 (gap 120 to 240) -->
    <rect x="965" y="-10" width="90" height="110" fill="url(#pipe)"/>
    <rect x="955" y="90" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="955" y="240" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="965" y="270" width="90" height="70" fill="url(#pipe)"/>
    <!-- pair 4 (gap 70 to 190) -->
    <rect x="1095" y="-10" width="90" height="60" fill="url(#pipe)"/>
    <rect x="1085" y="40" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="1085" y="190" width="110" height="30" rx="5" fill="url(#pipe)"/>
    <rect x="1095" y="220" width="90" height="120" fill="url(#pipe)"/>
  </g>

  <!-- flight path through the gaps -->
  <path d="M 60 150 C 115 150 120 210 190 210 C 290 210 380 285 560 268 C 760 250 880 190 1010 180 C 1060 176 1090 140 1140 130"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.95"/>

  <!-- title -->
  <g font-family="'Arial Black', 'Helvetica Neue', Arial, Helvetica, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round">
    <text x="600" y="162" font-size="88" letter-spacing="3" fill="#543847" stroke="#543847" stroke-width="14">FLAPPY RAILS</text>
    <text x="600" y="152" font-size="88" letter-spacing="3" fill="#ffb02e" stroke="#543847" stroke-width="12" paint-order="stroke">FLAPPY RAILS</text>
    <text x="600" y="200" font-size="26" letter-spacing="1" fill="#ffffff" stroke="#543847" stroke-width="6" paint-order="stroke" font-weight="800">Can your test suite make it through the pipes?</text>
  </g>

  <!-- the bird -->
  <g transform="translate(560 268) rotate(-10)" stroke="#543847" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="0" cy="0" rx="34" ry="27" fill="#f7d44c"/>
    <ellipse cx="4" cy="10" rx="22" ry="12" fill="#fdeaa0" stroke="none"/>
    <ellipse cx="-12" cy="6" rx="16" ry="10" fill="#fffbe8" transform="rotate(-25 -12 6)"/>
    <circle cx="14" cy="-9" r="11" fill="#fff"/>
    <circle cx="17" cy="-8" r="4.5" fill="#543847" stroke="none"/>
    <path d="M 26 -2 L 52 4 L 28 14 Z" fill="#f2653a"/>
    <path d="M 27 6 L 46 6" fill="none" stroke="#a4361a" stroke-width="2.5"/>
  </g>

  <!-- signal bars: the last one is missing -->
  <g transform="translate(626 222)">
    <rect x="0" y="22" width="9" height="10" rx="2" fill="#ffffff" stroke="#543847" stroke-width="2.5"/>
    <rect x="14" y="14" width="9" height="18" rx="2" fill="#ffffff" stroke="#543847" stroke-width="2.5"/>
    <rect x="28" y="6" width="9" height="26" rx="2" fill="#ffffff" stroke="#543847" stroke-width="2.5"/>
    <rect x="42" y="-2" width="9" height="34" rx="2" fill="none" stroke="#543847" stroke-width="2.5" stroke-dasharray="3 4" opacity="0.8"/>
  </g>

  <!-- ground: grass, sand and a railway track -->
  <rect x="0" y="336" width="1200" height="64" fill="#e6dc9a"/>
  <rect x="0" y="336" width="1200" height="14" fill="#73bf2e"/>
  <rect x="0" y="336" width="1200" height="4" fill="#9be15d"/>
  <rect x="0" y="348" width="1200" height="3" fill="#3d5a1c"/>
  <g fill="#7a5a3a" stroke="#4d3722" stroke-width="2">
    <rect x="12" y="370" width="26" height="14" rx="2"/>
    <rect x="72" y="370" width="26" height="14" rx="2"/>
    <rect x="132" y="370" width="26" height="14" rx="2"/>
    <rect x="192" y="370" width="26" height="14" rx="2"/>
    <rect x="252" y="370" width="26" height="14" rx="2"/>
    <rect x="312" y="370" width="26" height="14" rx="2"/>
    <rect x="372" y="370" width="26" height="14" rx="2"/>
    <rect x="432" y="370" width="26" height="14" rx="2"/>
    <rect x="492" y="370" width="26" height="14" rx="2"/>
    <rect x="552" y="370" width="26" height="14" rx="2"/>
    <rect x="612" y="370" width="26" height="14" rx="2"/>
    <rect x="672" y="370" width="26" height="14" rx="2"/>
    <rect x="732" y="370" width="26" height="14" rx="2"/>
    <rect x="792" y="370" width="26" height="14" rx="2"/>
    <rect x="852" y="370" width="26" height="14" rx="2"/>
    <rect x="912" y="370" width="26" height="14" rx="2"/>
    <rect x="972" y="370" width="26" height="14" rx="2"/>
    <rect x="1032" y="370" width="26" height="14" rx="2"/>
    <rect x="1092" y="370" width="26" height="14" rx="2"/>
    <rect x="1152" y="370" width="26" height="14" rx="2"/>
  </g>
  <rect x="0" y="364" width="1200" height="9" fill="#9aa3ad" stroke="#4d5560" stroke-width="2.5"/>
  <rect x="0" y="365" width="1200" height="3" fill="#d6dbe0"/>
</svg>
